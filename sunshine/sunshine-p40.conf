# Sunshine-Referenz fuer Kinder-VMs mit vGPU (GRID P40-4A, 6 GB Override)
# Am besten in der Weboberflaeche (https://localhost:47990) setzen.
# Alternativ diese Zeilen in C:\Program Files\Sunshine\config\sunshine.conf
# eintragen und den Sunshine-Dienst neu starten.

# --- Audio/Video ---
# exakten Namen pruefen: "%ProgramFiles%\Sunshine\tools\dxgi-info.exe"
adapter_name = GRID P40-4A
dd_configuration_option = ensure_only_display
# Moonlight: "Spieleinstellungen optimieren" an
dd_resolution_option = auto
dd_refresh_rate_option = auto
dd_hdr_option = disabled
# Kbit/s, Deckel gegen zu hohe Client-Einstellungen
max_bitrate = 40000

# --- Eingabe ---
# libvirtualhid-Lizenz in dieser VM aktiv
gamepad_driver = virtualhid
gamepad = auto

# --- Netzwerk ---
lan_encryption_mode = 0
upnp = disabled

# --- Erweitert ---
encoder = nvenc
capture = ddx
# HEVC Main (kein HDR)
hevc_mode = 2
# Pascal kann kein AV1
av1_mode = 1

# --- NVIDIA NVENC ---
# P1 = geringste Latenz
nvenc_preset = 1
nvenc_twopass = quarter_res
# kostet auf Pascal spuerbar Leistung
nvenc_spatial_aq = disabled
nvenc_vbv_increase = 0
nvenc_latency_over_power = enabled
# wichtig fuer Minecraft Java (OpenGL)
nvenc_opengl_vulkan_on_dxgi = enabled
nvenc_h264_cavlc = disabled
