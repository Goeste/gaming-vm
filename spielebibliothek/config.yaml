name: Spielebibliothek
version: "1.0.2"
slug: spielebibliothek
url: https://github.com/Goeste/gaming-vm
description: Steam-Spiele aller Konten anzeigen und auf dem Gaming-Master installieren
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:gamepad-variant
panel_title: Spielebibliothek
panel_admin: true
map:
  - type: share
    read_only: false
options:
  steam_api_key: ""
  accounts:
    - name: Papa
      steamid: "76561190000000000"
  library_folder: /share/gaming/Bibliothek
  proxmox_host: ""
  proxmox_user: root
schema:
  steam_api_key: password
  accounts:
    - name: str
      steamid: match(^7656\d{13}$)
  library_folder: str
  proxmox_host: str?
  proxmox_user: str
